<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- PWA Manifest & Mobile Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060d1b">
<link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Gym Tracker - Workout</title>
    <link rel="stylesheet" href="https://stormshaddow22.github.io/Fitness_Tracker/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="saveToast" class="save-toast">✓ Saved!</div>

    <!-- SETTINGS DRAWER MENU -->
    <div id="settingsOverlay" class="settings-overlay" onclick="toggleSettingsMenu()"></div>
    <div id="settingsDrawer" class="settings-drawer">
      <div class="drawer-header">
        <h3>⚙️ Settings</h3>
        <button class="close-btn" onclick="toggleSettingsMenu()">✕</button>
      </div>
      <div class="drawer-body">
        <div class="setting-item">
          <label>Actions</label>
          <button class="menu-action-btn" onclick="manualSave(); toggleSettingsMenu();">💾 Save Data</button>
        </div>
        <div class="setting-item">
          <label>Appearance</label>
          <button class="menu-action-btn" onclick="toggleTheme()">🌓 Toggle Theme</button>
        </div>
        
        <div class="setting-item">
  <label>Cloud Sync</label>
  <button class="menu-action-btn" id="googleLoginBtn" onclick="handleGoogleLogin()">🌐 Sign in with Google</button>
  <div id="googleEmailDisplay" style="display:none; background:var(--inp); border:1px solid var(--bdr); border-radius:8px; padding:8px; font-size:0.75rem; color:var(--ac2); font-weight:700; word-break:break-all; margin-top:4px;"></div>
  <button class="menu-action-btn" onclick="saveDataToDrive()" style="margin-top:6px;">☁️ Backup to Drive</button>
</div>
        <div class="setting-item">
          <label for="activationKeyInput">Activation Key</label>
          <input type="text" id="activationKeyInput" data-id="activationKey" placeholder="Enter key..." oninput="saveState(); verifyActivationKey();">
          <div id="keyStatus" style="font-size:0.7rem;margin-top:4px;font-weight:700;color:var(--tx2);">Not verified</div>
        </div>
      </div>
    </div>

    <!-- REMOVE EXERCISES MODAL -->
    <div id="removeModalOverlay" class="settings-overlay" onclick="closeRemoveModal()"></div>
    <div id="removeModalDrawer" class="settings-drawer" style="padding: 20px; display: flex; flex-direction: column;">
      <div class="drawer-header" style="margin-bottom: 15px;">
        <h3>🗑️ Remove Exercises</h3>
        <button class="close-btn" onclick="closeRemoveModal()">✕</button>
      </div>
      <div class="drawer-body" style="flex: 1; overflow-y: auto; margin-bottom: 15px;">
        <div id="removeModalList" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- Checkbox items populated dynamically -->
        </div>
      </div>
      <button class="complete-all-btn" style="background-color: var(--red, #ff4d4d); width: 100%; padding: 12px;" onclick="confirmRemoveSelected()">Delete Selected</button>
    </div>

    <header>
      <div class="header-top">
        <h1>🏆 Gym Tracker <span class="lightning">⚡⚡</span></h1>
        <div class="setting-item">
          <button class="menu-action-btn" onclick="manualSave(); ">💾 Save Data</button>
        </div>
        
        <div class="header-controls">
          <button class="hamburger-btn" onclick="toggleSettingsMenu()">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
      <div class="global-date-container">
        <label>LOG DATE:</label>
        <input type="date" id="globalWorkoutDate" onchange="handleGlobalDateChange()">
      </div>
      
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="pctLabel">0%</span>
          <span id="doneCount">0/7 exercises</span>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
    </header>

    <div class="page-content">
      <div class="day-header">
        <div class="day-title" id="routineTitle">Monday Layout</div>
        <div class="day-header-right">
          <button class="action-icon-btn" onclick="promptAddExercise()">➕</button>
          <button class="action-icon-btn" onclick="openRemoveModal()">🗑️</button>
          <button id="completeAllBtn" class="complete-all-btn" onclick="toggleCompleteAll()">Complete All</button>
        </div>
      </div>

      <div id="exerciseListContainer"></div>
    </div>

<!-- Timer button updated -->
    <button class="timer-btn" id="timerToggle" onclick="toggleTimer()">⏱</button>
    <div class="timer-overlay" id="timerOverlay">
      <div class="timer-panel">
        <button class="timer-close" onclick="toggleTimer()">✕</button>
        <div style="font-size:1.4rem;">⏱️ Rest Timer</div>
        <div class="timer-display" id="timerDisplay">1:00</div>
        <div class="timer-presets">
          <button class="timer-preset active" onclick="setTimerPreset(60,this)">1 min</button>
          <button class="timer-preset" onclick="setTimerPreset(90,this)">1:30</button>
          <button class="timer-preset" onclick="setTimerPreset(120,this)">2 min</button>
          <button class="timer-preset" onclick="setTimerPreset(180,this)">3 min</button>
          <button class="timer-preset" onclick="setTimerPreset(300,this)">5 min</button>
        </div>
        <div class="timer-controls">
          <button class="timer-ctrl start" id="timerStartBtn" onclick="startTimer()">Start</button>
          <button class="timer-ctrl reset" onclick="resetTimer()">Reset</button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-link">
        <span class="nav-icon">🍎</span>
        <span>My Routine</span>
      </a>
      <a href="workout.html" class="nav-link active">
        <span class="nav-icon">🏋️</span>
        <span>Workout</span>
      </a>
      <a href="history.html" class="nav-link">
        <span class="nav-icon">📅</span>
        <span>History</span>
      </a>
    </nav>

    <script>window.CURRENT_PAGE = 'Workout';</script>
    <script src="script.js"></script>
</body>
</html>

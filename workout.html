<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- PWA Manifest & Mobile Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060d1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Gym Tracker - Workout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Full-Screen Activation & Google Login Overlay -->
<div id="activationOverlay" style="position: fixed; inset: 0; background: rgba(15, 15, 19, 0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;">
  <div style="background: var(--card); border: 1px solid var(--bdr); border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <h2 style="color: var(--txt); margin-bottom: 8px;">🔒 Session Locked</h2>
    <p style="color: var(--txt-sub); font-size: 0.9rem; margin-bottom: 20px;">Please connect your Google account and validate your activation key to continue.</p>
    
    <button class="menu-action-btn" id="overlayGoogleBtn" onclick="handleGoogleLogin()" style="width: 100%; padding: 12px; margin-bottom: 12px; font-weight: bold; justify-content: center;">🌐 Connect Google Account</button>
    <div id="overlayEmailDisplay" style="display: none; font-size: 0.8rem; color: var(--ac2); margin-bottom: 16px; word-break: break-all;"></div>
    
    <div style="margin-bottom: 12px;">
      <input type="text" id="overlayKeyInput" placeholder="Enter License Key" style="width: 100%; padding: 10px; background: var(--inp); border: 1px solid var(--bdr); border-radius: 8px; color: var(--txt); text-align: center; margin-bottom: 8px;">
      <button class="menu-action-btn" onclick="overlayVerifyAndUnlock()" style="width: 70%; max-width: 280px; display: block; margin: 0 auto 8px; padding: 12px; background: var(--ac); color: #000; font-weight: bold; text-align: center;">Validate Key & Unlock</button>
      <button class="menu-action-btn" onclick="loadDataFromDrive()" style="width: 70%; max-width: 280px; display: block; margin: 0 auto; padding: 12px; background: var(--ac2); color: #000; font-weight: bold; text-align: center;">☁️ Get Data From Drive</button>
    </div>
    
    <div id="overlayKeyStatus" style="font-size: 0.8rem; margin-top: 8px; color: var(--orn);"></div>
  </div>
</div>

    <div id="saveToast" class="save-toast">✓ Saved!</div>

    <!-- SETTINGS DRAWER MENU -->
    <div id="settingsOverlay" class="settings-overlay" onclick="toggleSettingsMenu()"></div>
    <div id="settingsDrawer" class="settings-drawer">
      <div class="drawer-header">
        <h3>⚙️ Settings</h3>
        <button class="close-btn" onclick="toggleSettingsMenu()">✕</button>
      </div>
      <div class="drawer-body">
        <div class="setting-item">
          <label>Actions</label>
          <button class="menu-action-btn" onclick="manualSave(); toggleSettingsMenu();">💾 Save Data</button>
        </div>
        <div class="setting-item">
          <label>Appearance</label>
          <button class="menu-action-btn" onclick="toggleTheme()">🌓 Toggle Theme</button>
        </div>
        
        <div class="setting-item">
          <label>Account & License</label>
          <div id="settingsAccountStatus" style="font-size: 0.8rem; color: var(--txt-sub); margin-bottom: 6px;">Not connected</div>
          <button class="menu-action-btn" id="settingsGoogleBtn" onclick="handleGoogleLogin()">🌐 Connect / Reconnect Google</button>
          
          <div style="margin-top: 10px;">
            <label style="font-size: 0.75rem; color: var(--txt-sub);">Active Key:</label>
            <div id="settingsActiveKeyDisplay" style="background: var(--inp); border: 1px solid var(--bdr); border-radius: 8px; padding: 8px; font-size: 0.8rem; color: var(--ac); word-break: break-all; margin-top: 2px;">None</div>
          </div>
        </div>
        <div class="setting-item">
          <button class="menu-action-btn" onclick="loadDataFromDrive()" style="margin-top:6px;">☁️ Get Data From Drive</button>
        </div>
      </div>
    </div>

    <!-- REMOVE EXERCISES MODAL -->
    <div id="removeModalOverlay" class="settings-overlay" onclick="closeRemoveModal()"></div>
    <div id="removeModalDrawer" class="settings-drawer" style="padding: 20px; display: flex; flex-direction: column;">
      <div class="drawer-header" style="margin-bottom: 15px;">
        <h3>🗑️ Remove Exercises</h3>
        <button class="close-btn" onclick="closeRemoveModal()">✕</button>
      </div>
      <div class="drawer-body" style="flex: 1; overflow-y: auto; margin-bottom: 15px;">
        <div id="removeModalList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
      <button class="complete-all-btn" style="background-color: var(--red, #ff4d4d); width: 100%; padding: 12px;" onclick="confirmRemoveSelected()">Delete Selected</button>
    </div>

    <header>
      <div class="header-top">
        <h1>🏆 Gym Tracker <span class="lightning">⚡⚡</span></h1>
        <div class="header-controls">
          <button class="hamburger-btn" onclick="toggleSettingsMenu()">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
      <div class="global-date-container">
        <label>LOG DATE:</label>
        <input type="date" id="globalWorkoutDate" onchange="handleGlobalDateChange()">
      </div>
      
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="pctLabel">0%</span>
          <span id="doneCount">0/7 exercises</span>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
    </header>

    <div class="page-content">
      <div class="day-header">
        <div class="day-title" id="routineTitle">Monday Layout</div>
        <div class="day-header-right">
          <button class="action-icon-btn" onclick="promptAddExercise()">➕</button>
          <button class="action-icon-btn" onclick="openRemoveModal()">🗑️</button>
          <button id="completeAllBtn" class="complete-all-btn" onclick="toggleCompleteAll()">Complete All</button>
        </div>
      </div>

      <div id="exerciseListContainer"></div>
    </div>

    <button class="timer-btn" id="timerToggle" onclick="toggleTimer()">⏱</button>
    <div class="timer-overlay" id="timerOverlay">
      <div class="timer-panel">
        <button class="timer-close" onclick="toggleTimer()">✕</button>
        <div style="font-size:1.4rem;">⏱️ Rest Timer</div>
        <div class="timer-display" id="timerDisplay">1:00</div>
        <div class="timer-presets">
          <button class="timer-preset active" onclick="setTimerPreset(60,this)">1 min</button>
          <button class="timer-preset" onclick="setTimerPreset(90,this)">1:30</button>
          <button class="timer-preset" onclick="setTimerPreset(120,this)">2 min</button>
          <button class="timer-preset" onclick="setTimerPreset(180,this)">3 min</button>
          <button class="timer-preset" onclick="setTimerPreset(300,this)">5 min</button>
        </div>
        <div class="timer-controls">
          <button class="timer-ctrl start" id="timerStartBtn" onclick="startTimer()">Start</button>
          <button class="timer-ctrl reset" onclick="resetTimer()">Reset</button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-link">
        <span class="nav-icon">🍎</span>
        <span>My Routine</span>
      </a>
      <a href="workout.html" class="nav-link active">
        <span class="nav-icon">🏋️</span>
        <span>Workout</span>
      </a>
      <a href="history.html" class="nav-link">
        <span class="nav-icon">📅</span>
        <span>History</span>
      </a>
    </nav>

    <script>window.CURRENT_PAGE = 'Workout';</script>
    <script src="script.js"></script>
</body>
</html>
